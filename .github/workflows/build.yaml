name: build

on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      # TEMPORARY (try simple-setup)
      - name: Checkout autochem
        uses: actions/checkout@v4
        with:
          repository: Auto-Mech/autochem
          path: autochem

      - name: Checkout autoio
        uses: actions/checkout@v4
        with:
          repository: Auto-Mech/autoio
          path: autoio

      - name: Checkout autofile
        uses: actions/checkout@v4
        with:
          repository: Auto-Mech/autofile
          path: autofile

      - name: Checkout mechanalyzer
        uses: actions/checkout@v4
        with:
          repository: Auto-Mech/mechanalyzer
          path: mechanalyzer

      # Repository
      - name: Checkout the code
        uses: actions/checkout@v4
        with:
          path: mechdriver

      - name: List parent directory contents
        run: |
          ls -la .
          ls -la ./mechdriver

      # Environment
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          environments: build
          locked: false
          manifest-path: mechdriver

      # Test build (release workflow builds and uploads)
      - name: Build
        run: |
          pixi build