name: build

on: 
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true

    steps:
      # Repository
      - name: Checkout the code
        uses: actions/checkout@v4

      # Environment
      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.9
        with:
          environments: build
          frozen: true

      # TEMPORARY (try simple-setup)
      - name: Build
        run: |
          pixi run --frozen simple-setup
          pixi lock

      # Test build (release workflow builds and uploads)
      - name: Build
        run: |
          pixi build